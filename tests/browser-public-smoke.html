<!DOCTYPE html><html><head><meta charset="utf-8"><title>Plant browser checks</title></head><body><pre id="result">RUNNING</pre><script>
(async()=>{let lines=[];const check=(ok,msg)=>{if(!ok)throw Error(msg);lines.push('PASS '+msg)};const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function frame(url){const el=document.createElement('iframe');el.style.cssText='width:1200px;height:850px';document.body.append(el);await new Promise((res,rej)=>{el.onload=res;el.onerror=rej;el.src=url});await wait(600);return el;}
try{
const chooser=await frame('index.php');check(chooser.contentDocument.querySelectorAll('.plant-card').length===7,'seven plant cards');chooser.remove();
const fif=await frame('index.php?plant=fif');check(fif.contentDocument.querySelectorAll('.model-card').length===3,'FiF shows three models');check(fif.contentDocument.querySelector('.app-selected-plant').textContent==='FiF','FiF header');check(new URL(fif.contentDocument.querySelector('.app-brand').href).searchParams.get('plant')==='fif','home retains plant');check(!new URL(fif.contentDocument.querySelector('[data-change-plant]').href).searchParams.has('plant'),'Change Plant returns to chooser');
const pekan=await frame('index.php?plant=pekan');check(pekan.contentDocument.querySelector('.empty-message')!==null,'empty Pekan catalogue');check(fif.contentWindow.VIS_PLANT==='fif'&&pekan.contentWindow.VIS_PLANT==='pekan','independent tab contexts');check(new URL(pekan.contentWindow.visPlantUrl('index.php?page=variants&model=TEST')).searchParams.get('plant')==='pekan','navigation retains chosen plant');pekan.remove();fif.remove();
const parts=await frame('index.php?page=results&model=X50&variant=FL&grade=STANDARD&module=ER&plant=fif');check(parts.contentDocument.querySelector('.assembly-section h2')?.textContent.trim()==='FR STRUCTURE OVERVIEW','browser zero-sort display');parts.remove();
const mobile=await frame('index.php?plant=tanjung-malim');mobile.style.width='390px';await wait(200);const changeLink=mobile.contentDocument.querySelector('[data-change-plant]');check(changeLink.scrollWidth<=changeLink.clientWidth,'mobile Change Plant label fits');check(mobile.contentDocument.documentElement.scrollWidth<=mobile.contentDocument.documentElement.clientWidth,'mobile catalogue fits screen');mobile.remove();
const a=await frame('plant-admin-smoke.html');for(let i=0;i<100&&!a.contentDocument.getElementById('result');i++)await wait(30);const result=a.contentDocument.getElementById('result')?.textContent||'FAIL missing admin result';check(!result.includes('FAIL'),'admin browser checks: '+result);a.remove();
document.getElementById('result').textContent=lines.join('\n')+'\nALL PASS';
}catch(e){document.getElementById('result').textContent=lines.join('\n')+'\nFAIL '+e.stack;}
})();</script></body></html>
