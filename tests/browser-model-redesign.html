<!DOCTYPE html><html><head><style>body{margin:0}iframe{width:1200px;height:900px;border:0}</style></head><body><pre id="result">RUNNING</pre><script>
(async()=>{const lines=[],check=(v,m)=>{if(!v)throw Error(m);lines.push('PASS '+m)},wait=ms=>new Promise(r=>setTimeout(r,ms));async function load(url){const f=document.createElement('iframe');document.body.append(f);await new Promise(r=>{f.onload=r;f.src=url});await wait(400);return f}try{
let f=await load('index.php?plant=fif'),d=f.contentDocument;check(!d.querySelector('a[href*="admin.php"]'),'catalogue has no Admin Login');check(d.querySelectorAll('.model-card').length===3,'FiF has three models');check([...d.querySelectorAll('.model-image')].every(i=>i.complete&&i.naturalWidth),'model pictures load');check(new URL(d.querySelector('.app-brand').href).searchParams.get('plant')==='fif','catalogue home retains plant');f.style.width='390px';await wait(100);check(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'mobile has no overflow');f.remove();
f=await load('index.php?plant=pekan');d=f.contentDocument;check(d.querySelector('.empty-message')!==null,'empty plant supported');check(!d.querySelector('a[href*="admin.php"]'),'empty catalogue has no admin button');f.remove();
f=await load('index.php');check(f.contentDocument.querySelectorAll('a[href="admin.php"]').length===1,'plant menu retains Admin Login');f.remove();document.getElementById('result').textContent=lines.join('\n')+'\nALL PASS';
}catch(e){document.getElementById('result').textContent=lines.join('\n')+'\nFAIL '+e.stack}})();</script></body></html>
