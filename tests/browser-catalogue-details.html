<!DOCTYPE html><html><head><style>body{margin:0}iframe{width:1200px;height:1000px;border:0}</style></head><body><pre id="result">RUNNING</pre><script>
(async()=>{const lines=[],check=(v,m)=>{if(!v)throw Error(m);lines.push('PASS '+m)},wait=ms=>new Promise(r=>setTimeout(r,ms));
const cases=[['variants','index.php?page=variants&model=X50&plant=fif','.variant-choice',5],['markets','index.php?page=grades&model=X50&variant=A5%20LV&plant=fif','.grade-card',2],['grades','index.php?page=grades&model=S70&variant=AI-MY(LV)&plant=fif','.grade-card',3],['modules','index.php?page=modules&model=X50&variant=A5%20LV&grade=MEXICO&plant=fif','.module-button',3],['results','index.php?page=results&model=X50&variant=A5%20LV&grade=MEXICO&module=ER&plant=fif','.assembly-section',1]];
try{for(const [name,url,selector,count] of cases){const f=document.createElement('iframe');document.body.append(f);await new Promise(r=>{f.onload=r;f.src=url});await wait(650);const d=f.contentDocument;check(d.querySelectorAll(selector).length>=count,name+' content loads');check(d.querySelector('.detail-eyebrow')!==null,name+' styled heading');check(!d.querySelector('a[href*="admin.php"]'),name+' no admin button');check(new URL(d.querySelector('.app-brand').href).searchParams.get('plant')==='fif',name+' preserves plant');if(name==='results'){check(d.querySelector('.assembly-title').textContent==='FR STRUCTURE OVERVIEW','assembly order preserved');const img=d.querySelector('.overview-image');check(img&&img.complete&&img.naturalWidth>0,'assembly diagram loads');img.click();check(d.querySelector('#imageModal').classList.contains('visible')||d.querySelector('#imageModal').classList.contains('open')||d.querySelector('#imageModal').style.display==='flex','diagram zoom opens');}
f.style.width='390px';await wait(200);check(d.documentElement.scrollWidth<=d.documentElement.clientWidth,name+' mobile no overflow');f.remove()}
document.getElementById('result').textContent=lines.join('\n')+'\nALL PASS'}catch(e){document.getElementById('result').textContent=lines.join('\n')+'\nFAIL '+e.stack}})();</script></body></html>
